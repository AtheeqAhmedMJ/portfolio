<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Forces mobile browsers to render at desktop width — no blocker needed -->
  <meta name="viewport" content="width=1280" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Portfolio of Atheeq Ahmed, software engineer, 3D developer, and creative technologist." />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />
  <title>Atheeq Ahmed Portfolio</title>

  <!-- Preconnect to Google Fonts CDN before any request fires -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Preload the Barcode font CSS so it's parsed before JS boots -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Libre+Barcode+128+Text&display=block" />
  <!-- Then load it (display=block: no FOUT flash — text stays invisible until ready, matching the animation) -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Libre+Barcode+128+Text&display=block" />

  <link rel="icon" href="/favicon.ico" />

  <!-- Preload audio for landing page -->
  <link rel="preload" href="/Audio/Theme.mp3" as="audio" type="audio/mpeg" />

  <style>
    html, body, #root {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      position: relative;
      z-index: -999999999;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
